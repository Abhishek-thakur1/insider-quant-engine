services:
  # ── Redis ──────────────────────────────────────────────────────────────────
  redis_cache:
    image: redis:7-alpine
    container_name: quant_redis
    restart: always
    ports:
      - "6379:6379"

  # ── Scheduler ─────────────────────────────────────────────────────────────
  # Always on. Owns the full daily lifecycle via cron + docker start/stop.
  quant_scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: quant_scheduler
    restart: always
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - scheduler_logs:/var/log
    depends_on:
      - redis_cache

  # ── Auth Bridge ───────────────────────────────────────────────────────────
  # Created at compose up but kept stopped — scheduler calls `docker start quant_auth`.
  # restart:no means Docker never auto-restarts it after quant_auth exits cleanly.
  quant_auth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quant_auth
    command: npx tsx src/config/auth.ts
    restart: "no"
    ports:
      - "3000:3000"
    volumes:
      - token_store:/app/token
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      - redis_cache

  # ── Quant Engine ──────────────────────────────────────────────────────────
  # Created at compose up but kept stopped — scheduler calls `docker start quant_engine`.
  # restart:no means Docker never auto-restarts it after scheduler calls `docker stop`.
  quant_engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quant_engine
    command: >
      sh -c "
        echo '[Engine] Waiting for access token...';
        until [ -f /app/token/access_token.txt ]; do
          echo '[Engine] Token not found. Retrying in 10s...';
          sleep 10;
        done;
        echo '[Engine] Token found. Booting live engine.';
        npx tsx src/ingestion/websocket.ts
      "
    restart: "no"
    volumes:
      - token_store:/app/token
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      - redis_cache

volumes:
  token_store:
  scheduler_logs:

