version: "3.8"

services:
  # The Ingestion Engine & Telegram Dispatcher
  quant-engine:
    build: .
    container_name: quant_engine_node
    volumes:
      # Syncs your local code to the container so you don't have to rebuild on every save
      - .:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - .env
    environment:
      # Tells Node to look for Redis at the container name, not 'localhost'
      - REDIS_HOST=redis_cache
      - REDIS_PORT=6379
    depends_on:
      - redis_cache

  # The In-Memory Message Broker
  redis_cache:
    image: redis:7-alpine
    container_name: quant_engine_redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
