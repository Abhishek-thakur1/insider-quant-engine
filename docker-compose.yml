services:
  # ── Redis ──────────────────────────────────────────────────────────────────
  redis_cache:
    image: redis:7-alpine
    container_name: quant_redis
    restart: always
    ports:
      - '6379:6379'

    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 60 1
    volumes:
      - redis_data:/data

  # ── Postgres ───────────────────────────────────────────────────────────────
  postgres_db:
    image: postgres:15-alpine
    container_name: quant_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-insider_quant}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  # ── Scheduler ─────────────────────────────────────────────────────────────
  # Always on. Owns the full daily lifecycle via cron + docker start/stop.
  quant_scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: quant_scheduler
    restart: always
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - scheduler_logs:/var/log
      - token_store:/app/token
    depends_on:
      - redis_cache

  # ── Auth Bridge ───────────────────────────────────────────────────────────
  quant_auth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quant_auth
    command: npx tsx src/config/auth.ts
    restart: 'no'
    ports:
      - '3000:3000'
    volumes:
      - token_store:/app/token
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      - redis_cache

  # ── Quant Engine ──────────────────────────────────────────────────────────
  quant_engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quant_engine
    command: >
      sh -c "
        echo '[Engine] Waiting for access token...';
        until [ -f /app/token/access_token.txt ]; do
          echo '[Engine] Token not found. Retrying in 10s...';
          sleep 10;
        done;
        echo '[Engine] Token found.';
        echo '[Engine] Booting live engine (watchlist from the 16:30 quant_screener job; no screening at boot).';
        exec node --import tsx src/ingestion/websocket.ts
      "
    restart: 'on-failure'
    # exec node (not npx): node becomes PID 1, so docker stop's SIGTERM reaches the
    # engine's shutdown() (socket close, signals flush, Redis quit). Before, sh was
    # PID 1 and ignored SIGTERM: every stop ended in SIGKILL after 10 s (exit 137,
    # Oct 21). 'exec npx tsx' is NOT enough: npm exec exits on SIGTERM without
    # waiting for its child (stub-proven 2026-10-21), killing the engine mid-handler.
    # The handler needs ~5 s (3 s settle + 2 s flush); 20 s leaves margin.
    stop_grace_period: 20s
    volumes:
      - token_store:/app/token
      - screener_data:/app/data # reads watchlist.json, watchlist_meta.json, anomaly_universe.json; writes ema_shadow/<date>.jsonl (EMA shadow)
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      - redis_cache
      - postgres_db

  # ── EOD Screener (job) ────────────────────────────────────────────────────
  # Not a service: created once, started by the scheduler at 16:30 IST on
  # trading days (lifecycle.sh run_screener → docker start -a quant_screener).
  # Writes the watchlist the engine reads at its next boot. The "jobs" profile
  # keeps a plain `docker compose up` from running it at an arbitrary time.
  # node --import tsx (not npx) so the exit code reaches the scheduler intact.
  quant_screener:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quant_screener
    profiles: ['jobs']
    command: node --import tsx scripts/screener_eod.ts
    restart: 'no'
    volumes:
      - token_store:/app/token
      - screener_data:/app/data
      - /app/node_modules
    env_file:
      - .env

  # ── API Server (Dashboard Backend) ────────────────────────────────────────
  quant_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quant_api
    command: npx tsx src/api/server.ts
    restart: always
    ports:
      - '8080:8080'
    env_file:
      - .env
    depends_on:
      - redis_cache
      - postgres_db

volumes:
  token_store:
  screener_data:
  scheduler_logs:
  redis_data:
  pg_data:

